[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned compiler — matches the `pragma solidity ^0.8.24` in every contract.
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Ferminux-geth is a fork of geth v1.10.26 (pre-Shanghai): PUSH0 is NOT a valid
# opcode on chain 3961, so bytecode must target Paris. Verified by disassembly
# in script/check-push0.sh — do not raise this without upgrading the client.
evm_version = "paris"

# No CBOR metadata trailer. Two reasons, both load-bearing for a DEX:
#   1. Pair addresses are CREATE2-derived from the init code hash. With the
#      metadata trailer the hash moves when a comment or a file path changes;
#      without it the hash depends only on the compiled code.
#   2. The trailing metadata is data, not code, but a disassembler cannot know
#      that — it decodes as garbage opcodes and produces phantom PUSH0 hits.
#      Removing it makes the "zero PUSH0" proof exact rather than heuristic.
bytecode_hash = "none"
cbor_metadata = false

# Test-suite tuning
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }

[fmt]
line_length = 120
