apiVersion: v1
kind: Service
metadata:
  name: explorer-db
  namespace: ferminux
  labels:
    app.kubernetes.io/name: explorer-db
    app.kubernetes.io/part-of: ferminux-explorer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: explorer-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: explorer-db
  namespace: ferminux
  labels:
    app.kubernetes.io/name: explorer-db
    app.kubernetes.io/part-of: ferminux-explorer
spec:
  serviceName: explorer-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: explorer-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explorer-db
        app.kubernetes.io/part-of: ferminux-explorer
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          args: ["postgres", "-c", "max_connections=200"]
          env:
            - name: POSTGRES_DB
              value: blockscout
            - name: POSTGRES_USER
              value: blockscout
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explorer-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "blockscout", "-d", "blockscout"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "blockscout", "-d", "blockscout"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <set to your cluster's class if not default>
        resources:
          requests:
            storage: 50Gi
