apiVersion: v1
kind: Service
metadata:
  name: explorer-frontend
  namespace: ferminux
  labels:
    app.kubernetes.io/name: explorer-frontend
    app.kubernetes.io/part-of: ferminux-explorer
spec:
  selector:
    app.kubernetes.io/name: explorer-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer-frontend
  namespace: ferminux
  labels:
    app.kubernetes.io/name: explorer-frontend
    app.kubernetes.io/part-of: ferminux-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: explorer-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explorer-frontend
        app.kubernetes.io/part-of: ferminux-explorer
    spec:
      containers:
        - name: frontend
          # verified multi-arch (amd64+arm64) via docker manifest inspect 2026-08-20
          image: ghcr.io/blockscout/frontend:v2.3.5
          envFrom:
            - configMapRef:
                name: explorer-frontend-env
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
