apiVersion: v1
kind: ConfigMap
metadata:
  name: explorer-seeder-sql
  namespace: ferminux
  labels:
    app.kubernetes.io/part-of: ferminux-explorer
data:
  emission-ranges.sql: |
    -- Ferminux emission schedule -> Blockscout emission_rewards (idempotent).
    -- subsidy(block) = 6 FMX >> era, era = block / 4,500,000 (chain/consensus/powhash/ferminux.go)
    INSERT INTO emission_rewards (block_range, reward)
    SELECT int8range(era * 4500000, (era + 1) * 4500000),
           div(6000000000000000000::numeric, (2::numeric ^ era))
    FROM generate_series(0, 62) AS era
    WHERE NOT EXISTS (SELECT 1 FROM emission_rewards);
    INSERT INTO emission_rewards (block_range, reward)
    SELECT int8range(283500000, NULL), 0
    WHERE NOT EXISTS (SELECT 1 FROM emission_rewards WHERE block_range = int8range(283500000, NULL));
  seed-rewards.sql: |
    -- Miner reward per indexed block: subsidy + tip fees. geth variant cannot
    -- fetch beneficiaries over RPC, so this fills block_rewards for the UI/API.
    INSERT INTO block_rewards (address_hash, block_hash, address_type, reward, inserted_at, updated_at)
    SELECT b.miner_hash,
           b.hash,
           'validator',
           div(6000000000000000000::numeric, (2::numeric ^ LEAST((b.number / 4500000)::int, 63)))
           + GREATEST(
               COALESCE((SELECT SUM(COALESCE(t.gas_used, 0) * COALESCE(t.gas_price, 0))
                           FROM transactions t
                          WHERE t.block_hash = b.hash), 0)
               - COALESCE(b.base_fee_per_gas, 0) * COALESCE(b.gas_used, 0),
               0),
           NOW(),
           NOW()
    FROM blocks b
    WHERE b.consensus
      AND NOT EXISTS (SELECT 1 FROM block_rewards r WHERE r.block_hash = b.hash)
    ON CONFLICT DO NOTHING;
