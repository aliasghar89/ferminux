# Non-secret configuration: backend env, chain spec (premine import),
# nginx proxy config, and the rewards-seeder SQL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: explorer-backend-env
  namespace: ferminux
  labels:
    app.kubernetes.io/part-of: ferminux-explorer
data:
  # --- chain identity ---
  CHAIN_ID: "3961"
  COIN: "FMX"
  COIN_NAME: "FMX"
  NETWORK: "Ferminux"
  SUBNETWORK: "Ferminux Network"
  CHAIN_TYPE: "default"
  # --- node (point at the internal RPC service; rpc.ferminux.net works too) ---
  ETHEREUM_JSONRPC_VARIANT: "geth"
  ETHEREUM_JSONRPC_TRANSPORT: "http"
  ETHEREUM_JSONRPC_HTTP_URL: "http://fmx-rpc.ferminux.svc.cluster.local:8545"
  ETHEREUM_JSONRPC_TRACE_URL: "http://fmx-rpc.ferminux.svc.cluster.local:8545"
  ETHEREUM_JSONRPC_WS_URL: "ws://fmx-rpc.ferminux.svc.cluster.local:8546"
  # ferminux-geth public RPC exposes no debug/trace namespace
  INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
  INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"
  CHAIN_SPEC_PATH: "/app/chainspec/genesis.json"
  # --- server ---
  PORT: "4000"
  ECTO_USE_SSL: "false"
  POOL_SIZE: "30"
  POOL_SIZE_API: "10"
  API_V2_ENABLED: "true"
  NETWORK_PATH: "/"
  EIP_1559_ELASTICITY_MULTIPLIER: "2"
  # network totals recounted every 5 min (defaults 2 h / 30 min / 1 h; costs: envs/backend.env)
  CACHE_TXS_COUNT_PERIOD: "5m"
  CACHE_ADDRESS_COUNT_PERIOD: "5m"
  CACHE_TRANSACTIONS_24H_STATS_PERIOD: "5m"
  # --- self-hosted: no external integrations ---
  DISABLE_EXCHANGE_RATES: "true"
  MICROSERVICE_SC_VERIFIER_ENABLED: "false"
  MICROSERVICE_ETH_BYTECODE_DB_ENABLED: "false"
  MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
  MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
  MICROSERVICE_METADATA_ENABLED: "false"
  SOURCIFY_INTEGRATION_ENABLED: "false"
  ACCOUNT_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: explorer-frontend-env
  namespace: ferminux
  labels:
    app.kubernetes.io/part-of: ferminux-explorer
data:
  NEXT_PUBLIC_APP_PROTOCOL: "https"
  NEXT_PUBLIC_APP_HOST: "explorer.ferminux.net"
  NEXT_PUBLIC_APP_PORT: "443"
  NEXT_PUBLIC_API_PROTOCOL: "https"
  NEXT_PUBLIC_API_HOST: "explorer.ferminux.net"
  NEXT_PUBLIC_API_PORT: "443"
  NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: "wss"
  NEXT_PUBLIC_API_BASE_PATH: "/"
  NEXT_PUBLIC_NETWORK_NAME: "Ferminux Network"
  NEXT_PUBLIC_NETWORK_SHORT_NAME: "Ferminux"
  NEXT_PUBLIC_NETWORK_ID: "3961"
  NEXT_PUBLIC_NETWORK_CURRENCY_NAME: "Ferminux"
  NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: "FMX"
  NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
  NEXT_PUBLIC_NETWORK_RPC_URL: "https://rpc.ferminux.net"
  NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE: "mining"
  NEXT_PUBLIC_IS_TESTNET: "false"
  NEXT_PUBLIC_GAS_TRACKER_ENABLED: "true"
  NEXT_PUBLIC_AD_BANNER_PROVIDER: "none"
  NEXT_PUBLIC_AD_TEXT_PROVIDER: "none"
  NEXT_PUBLIC_HOMEPAGE_CHARTS: "[]"
  # Branding — keep in step with explorer/envs/frontend.env, which is what the
  # compose deployment actually reads. See the notes there for why the URLs must
  # be absolute with a file extension, and why FAVICON_MASTER_URL is a PNG.
  NEXT_PUBLIC_NETWORK_LOGO: "https://ferminux.net/assets/brand/fmx-wordmark.svg"
  NEXT_PUBLIC_NETWORK_LOGO_DARK: "https://ferminux.net/assets/brand/fmx-wordmark-dark.svg"
  NEXT_PUBLIC_NETWORK_ICON: "https://ferminux.net/assets/brand/fmx-round.svg"
  NEXT_PUBLIC_NETWORK_ICON_DARK: "https://ferminux.net/assets/brand/fmx-round.svg"
  NEXT_PUBLIC_COLOR_THEME_DEFAULT: "light"
  NEXT_PUBLIC_HOMEPAGE_HERO_BANNER_CONFIG: '{"background":["#a8761c","#8a5f14"],"text_color":["#ffffff","#ffffff"]}'
  NEXT_PUBLIC_OG_IMAGE_URL: "https://ferminux.net/assets/brand/fmx-og.png"
  FAVICON_MASTER_URL: "https://ferminux.net/assets/brand/fmx-256.png"
  NEXT_PUBLIC_PROMOTE_BLOCKSCOUT_IN_TITLE: "false"
  NEXT_PUBLIC_OG_DESCRIPTION: "Block explorer for Ferminux Network (chain ID 3961). Search transactions, addresses, blocks and verified contracts."
---
