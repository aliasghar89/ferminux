# REPLACE the placeholder values before applying:
#   POSTGRES_PASSWORD:  openssl rand -hex 24
#   SECRET_KEY_BASE:    openssl rand -base64 48
# DATABASE_URL must embed the same POSTGRES_PASSWORD.
# Prefer: kubectl -n ferminux create secret generic explorer-secrets \
#   --from-literal=POSTGRES_PASSWORD=... \
#   --from-literal=SECRET_KEY_BASE=... \
#   --from-literal=DATABASE_URL=postgresql://blockscout:...@explorer-db:5432/blockscout
apiVersion: v1
kind: Secret
metadata:
  name: explorer-secrets
  namespace: ferminux
  labels:
    app.kubernetes.io/part-of: ferminux-explorer
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE-ME-openssl-rand-hex-24"
  SECRET_KEY_BASE: "CHANGE-ME-openssl-rand-base64-48"
  DATABASE_URL: "postgresql://blockscout:CHANGE-ME-openssl-rand-hex-24@explorer-db:5432/blockscout"
