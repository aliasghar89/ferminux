# Seeds block rewards into the explorer DB every minute, as the compose
# rewards-sidecar does (explorer/seeder/run.sh): Blockscout's geth variant
# cannot fetch them over RPC, and from the authority fork it would credit
# every block to header.Coinbase (zero, or a vote's subject) rather than the
# signer that confirmed it. The scripts are the explorer-seeder-sql ConfigMap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: explorer-rewards-seeder
  namespace: ferminux
  labels:
    app.kubernetes.io/name: explorer-rewards-seeder
    app.kubernetes.io/part-of: ferminux-explorer
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 55
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: explorer-rewards-seeder
            app.kubernetes.io/part-of: ferminux-explorer
        spec:
          restartPolicy: Never
          containers:
            - name: psql
              image: postgres:17.5-alpine
              command: ["/bin/sh", "-c"]
              # All three run every pass, as in run.sh: a failed reward table
              # must not also stop signer attribution. But a script's status
              # is its last command's, and seed-signers.sh exits 0 on every
              # path, so each psql status is kept and returned at the end.
              # Otherwise a broken seed-rewards.sql would leave the Job marked
              # Succeeded, its error only in a log kept for one minute, while
              # the explorer publishes stale reward figures.
              args:
                - |
                  rc=0
                  psql -q -v ON_ERROR_STOP=1 -f /seeder/emission-ranges.sql || rc=$?
                  psql -q -v ON_ERROR_STOP=1 -f /seeder/seed-rewards.sql || rc=$?
                  sh /seeder/seed-signers.sh
                  exit "$rc"
              env:
                # seed-signers.sh asks this node which signer confirmed each
                # authority block (clique_getSigner): the node the backend
                # indexes from.
                - name: FMX_RPC
                  valueFrom:
                    configMapKeyRef:
                      name: explorer-backend-env
                      key: ETHEREUM_JSONRPC_HTTP_URL
                - name: PGHOST
                  value: explorer-db
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: blockscout
                - name: PGUSER
                  value: blockscout
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: explorer-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: seeder-sql
                  mountPath: /seeder
                  readOnly: true
          volumes:
            - name: seeder-sql
              configMap:
                name: explorer-seeder-sql
