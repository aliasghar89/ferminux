# Ingress for explorer.ferminux.net (ingress-nginx).
#
# TLS / Cloudflare-origin note:
#   Traffic path is Cloudflare (orange-cloud DNS record) -> origin. Issue a
#   Cloudflare Origin CA certificate for explorer.ferminux.net (Cloudflare
#   dashboard -> SSL/TLS -> Origin Server -> Create Certificate, 15-year RSA),
#   set the zone SSL mode to "Full (strict)", then store it as the TLS secret:
#     kubectl -n ferminux create secret tls explorer-origin-tls \
#       --cert=explorer.ferminux.net.origin.pem \
#       --key=explorer.ferminux.net.origin.key
#   The Origin CA cert is only trusted by Cloudflare — do not expose the
#   origin directly to the internet; restrict ingress to Cloudflare IP ranges.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: explorer
  namespace: ferminux
  labels:
    app.kubernetes.io/part-of: ferminux-explorer
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # websockets (/socket/*) need long-lived connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - explorer.ferminux.net
      secretName: explorer-origin-tls
  rules:
    - host: explorer.ferminux.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: explorer-backend
                port:
                  number: 4000
          - path: /socket
            pathType: Prefix
            backend:
              service:
                name: explorer-backend
                port:
                  number: 4000
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: explorer-backend
                port:
                  number: 4000
          - path: /public-metrics
            pathType: Prefix
            backend:
              service:
                name: explorer-backend
                port:
                  number: 4000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: explorer-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: explorer-frontend
                port:
                  number: 3000
