# Single entrypoint for the Ferminux explorer: API + websockets -> backend,
# everything else -> frontend. Mirrors Blockscout's reference proxy.
# Upstreams are resolved through Docker's embedded DNS via variables so nginx
# starts (and recovers) even while backend/frontend containers are restarting.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream  http://backend:4000;
    set $frontend_upstream http://frontend:3000;

    proxy_http_version 1.1;
    client_max_body_size 10m;

    location ~ ^/(api|socket|sitemap.xml|public-metrics|auth/auth0|auth/auth0/callback|auth/logout) {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
