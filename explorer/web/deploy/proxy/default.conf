# explorer.ferminux.net, stack proxy (fmx-explorer-proxy) after the switch to our own explorer front end.
# Mounted as a DIRECTORY at /etc/nginx/conf.d (docker-compose.spa.yml): editing these files on the box and
# running `nginx -s reload` is enough; no single-file bind mount to go stale on a rename.
#   - /api, /api/v2/*, /api/v1/graphql, /api/eth-rpc, /socket/*: the index backend, exactly as before.
#   - everything else: the static SPA in /usr/share/nginx/explorer (explorer/web/dist).
# Spec: .ui-craft/surfaces/explorer.md §13 (serving), §3.4 (routes), §3.6 (legacy redirects).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# App routes (§3.4). 1 = serve the SPA with 200. Anything else gets the SPA's own 404 page WITH status 404.
# 2 = the Step 1 checkpoint-validator pages: served from validators.html, which the build writes only when the
# ValidatorHub and lens addresses are configured (vite.config.ts); without it they stay real 404s.
map $uri $spa_route {
    default                                                                   0;
    "/"                                                                       1;
    "~*^/(blocks|txs|tokens|accounts|verified-contracts|stats|search-results|token-transfers|internal-txs|contract-verification|contract_verification|api-docs)/?$" 1;
    "~*^/block/countdown(/[0-9,]+)?/?$"                                        1;
    "~*^/block/[^/]+/?$"                                                      1;
    "~*^/tx/[^/]+/?$"                                                         1;
    "~*^/address/[^/]+(/contract[-_]verification)?/?$"                        1;
    "~*^/token/[^/]+(/instance/[^/]+)?/?$"                                    1;
    "~*^/validators(/[0-9]+)?/?$"                                              2;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # TLS ends at the edge nginx: keep redirects relative so they stay on https://explorer.ferminux.net
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    proxy_http_version 1.1;
    client_max_body_size 10m;

    root /usr/share/nginx/explorer;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_vary on;

    # ---- the index backend (unchanged targets). The old proxy matched the bare prefix "api", which would also
    # take our /api-docs page; this anchors it: /api, /api?module=… (Etherscan-style), /api/…, /socket/…
    # sitemap.xml is no longer proxied: ours is static.
    location ~ ^/(api(/|$)|socket(/|$)|public-metrics(/|$)|auth/) {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- legacy Blockscout URL shapes (§3.6): 307 before the SPA (the router has the same map for in-app hits)
    location ~* ^/gas-tracker/?$                        { return 307 /stats#gas; }
    location ~* ^/advanced-filter/?$                    { return 307 /txs; }
    location ~* ^/charts/?$                             { return 308 /stats; }
    location ~* ^/stats/[^/]+/?$                        { return 307 /stats; }
    location ~* ^/blocks?/([^/]+)/transactions/?$       { return 307 /block/$1?tab=txs; }
    location ~* ^/block/([^/]+)/withdrawals/?$          { return 307 /block/$1; }
    location ~* ^/blocks/([^/]+)/?$                     { return 307 /block/$1; }
    location ~* ^/uncles/?$                             { return 307 /blocks?tab=uncles; }
    location ~* ^/reorgs/?$                             { return 307 /blocks?tab=reorgs; }
    location ~* ^/pending-transactions/?$               { return 307 /txs?tab=pending; }
    location ~* ^/tx/([^/]+)/internal-transactions/?$   { return 307 /tx/$1?tab=internal; }
    location ~* ^/tx/([^/]+)/logs/?$                    { return 307 /tx/$1?tab=logs; }
    location ~* ^/tx/([^/]+)/token-transfers/?$         { return 307 /tx/$1?tab=token_transfers; }
    location ~* ^/tx/([^/]+)/raw-trace/?$               { return 307 /tx/$1?tab=raw_trace; }
    location ~* ^/tx/([^/]+)/state/?$                   { return 307 /tx/$1?tab=state; }
    location ~* ^/address/([^/]+)/transactions/?$       { return 307 /address/$1; }
    location ~* ^/address/([^/]+)/tokens/?$             { return 307 /address/$1?tab=tokens; }
    location ~* ^/address/([^/]+)/token-transfers/?$    { return 307 /address/$1?tab=token_transfers; }
    location ~* ^/address/([^/]+)/internal-transactions/?$ { return 307 /address/$1?tab=internal_txns; }
    location ~* ^/address/([^/]+)/coin-balances/?$      { return 307 /address/$1?tab=coin_balance_history; }
    location ~* ^/address/([^/]+)/validations/?$        { return 307 /address/$1?tab=blocks_validated; }
    location ~* ^/address/([^/]+)/logs/?$               { return 307 /address/$1?tab=logs; }
    location ~* ^/address/([^/]+)/(contracts|read-contract|write-contract|read-proxy|write-proxy)/?$ { return 307 /address/$1?tab=contract; }
    location ~* ^/address/([^/]+)/(contract_verifications/new|verify-via-flattened-code/new)/?$ { return 307 /address/$1/contract-verification; }
    location ~* ^/tokens/([^/]+)/?$                     { return 307 /token/$1; }
    location ~* ^/token/([^/]+)/token-holders/?$        { return 307 /token/$1?tab=holders; }
    location ~* ^/token/([^/]+)/token-transfers/?$      { return 307 /token/$1?tab=token_transfers; }
    location ~* ^/token/([^/]+)/inventory/?$            { return 307 /token/$1?tab=inventory; }
    location ~* ^/token/([^/]+)/read-contract/?$        { return 307 /token/$1?tab=contract; }
    location ~* ^/token/([^/]+)/instance/([^/]+)/(token-transfers|token-holders)/?$ { return 307 /token/$1/instance/$2; }
    location ~* ^/token/([^/]+)/instance/([^/]+)/metadata/?$ { return 307 /token/$1/instance/$2?tab=metadata; }
    location ~* ^/bridged-tokens/?$                     { return 307 /tokens; }
    location ~* ^/graphiql/?$                           { return 307 /api-docs?tab=graphql_api; }

    # ---- static files. Hashed build output: a year, immutable. Everything else: short, revalidated.
    # (no `always` on these Cache-Control headers: a 404 for a missing asset must not be cached for a year)
    location ^~ /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location ^~ /brand/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~ ^/(favicon\.svg|robots\.txt|sitemap\.xml|llms\.txt)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---- the app shell: never cached, so a deploy lands on the next page load
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    # the validators pages' shell (see the map); a direct /validators.html is a 404 like any unknown path
    location = /validators.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        error_page 404 /404.html;
        try_files /validators.html =404;
    }
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        # 404.html is the same shell (vite.config.ts copies it); served WITH status 404, the app draws its 404 page
        error_page 404 /404.html;
        if ($spa_route = 0) { return 404; }
        if ($spa_route = 2) { rewrite ^ /validators.html last; }
        try_files /index.html =404;
    }
}
