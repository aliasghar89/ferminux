# Ferminux Network — Blockscout explorer stack
#
# Images are pinned to tags verified multi-arch (linux/amd64 + linux/arm64)
# via `docker manifest inspect` on 2026-08-20:
#   ghcr.io/blockscout/blockscout:9.0.2   [linux/amd64, linux/arm64]
#   ghcr.io/blockscout/frontend:v2.3.5    [linux/amd64, linux/arm64]
#   postgres:17.5-alpine                  [multi-arch]
#   nginx:1.29-alpine                     [multi-arch]
# and on 2026-09-25:
#   ghcr.io/blockscout/smart-contract-verifier:v1.10.7  [linux/amd64, linux/arm64]
#     index sha256:0b82d1e2f57354b5aa785b33cc82d24a1d2e2d5838dce6adcb81e8bc144c1724
#     run as linux/amd64 everywhere (see the service)
#
# Node URL is parameterized:
#   FMX_RPC_HTTP  (default http://host.docker.internal:8545)
#   FMX_RPC_WS    (default ws://host.docker.internal:8546)
# Defaults hit the live devnet from inside colima/Docker Desktop.
# In production point them at the internal RPC service
# (e.g. https://rpc.ferminux.net or an internal node URL).
#
# Self-hosted: exchange rates, ads, Sourcify, eth-bytecode-db and all other
# external integrations are disabled — the stack talks to the configured
# Ferminux node and its own Postgres. The one exception is the contract
# verifier, which downloads compilers (binaries.soliditylang.org for solc,
# GitHub for vyper) on first use.

name: ferminux-explorer

# Every service carries its own log cap. dockerd on the production box predates
# /etc/docker/daemon.json and has never loaded its defaults, so a container
# without one grows its json log without bound: the backend reached 8.7 GB of
# logs (a crash loop writing ~25k lines/min) before this was added.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:17.5-alpine
    container_name: fmx-explorer-db
    logging: *logging
    restart: unless-stopped
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmx-explorer-db-pw}
    ports:
      # host port 7432 to avoid colliding with anything on 5432; internal-only is fine too
      - "${FMX_EXPLORER_DB_PORT:-7432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ghcr.io/blockscout/blockscout:9.0.2
    container_name: fmx-explorer-backend
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      # makes host.docker.internal resolve under colima / plain dockerd, not only Docker Desktop
      - "host.docker.internal:host-gateway"
    env_file:
      - ./envs/backend.env
    environment:
      ETHEREUM_JSONRPC_HTTP_URL: ${FMX_RPC_HTTP:-http://host.docker.internal:8545}
      ETHEREUM_JSONRPC_TRACE_URL: ${FMX_RPC_HTTP:-http://host.docker.internal:8545}
      ETHEREUM_JSONRPC_WS_URL: ${FMX_RPC_WS:-ws://host.docker.internal:8546}
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD:-fmx-explorer-db-pw}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-2fszasAx2eLGBTm8y4z28wIVJScdACjPnjjMMcAHCpe7WFsCmAvSFAwpQ9fvmjfd}
    volumes:
      - ./chainspec:/app/chainspec:ro
      - backend-dets:/app/dets
      - backend-logs:/app/logs

  # Source verification. The backend sends every verification (UI, /api/v2 and the
  # Etherscan-style /api?module=contract&action=verifysourcecode that `forge verify-contract
  # --verifier blockscout` uses) to this service, and lists the compiler versions it reports
  # (/api/v2/smart-contracts/verification/config). backend.env: MICROSERVICE_SC_VERIFIER_*.
  #
  # v1.10.7 is the newest release of the 1.10 line, which was current when Blockscout 9.0.2
  # shipped (verifier 1.10.0, 2025-05; Blockscout 9.0.2, 2025-08). The backend calls only the
  # verifier's /api/v2/verifier/{solidity,vyper}/... routes, unchanged across 1.10.x.
  # linux/amd64 on purpose, as in Blockscout's own compose: solc is only published as a
  # linux-amd64 binary, which the arm64 image could not run. The server is x86_64.
  #
  # No ports: reachable only from containers on this project's default network (the backend).
  # Outbound HTTPS only for compilers: binaries.soliditylang.org (solc list and binaries),
  # raw.githubusercontent.com and github.com (vyper list and binaries). See envs/verifier.env.
  # Not a dependency of the backend: the explorer keeps running if this is down; only
  # verification and the compiler list stop.
  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier:v1.10.7
    platform: linux/amd64
    container_name: fmx-explorer-verifier
    logging: *logging
    restart: unless-stopped
    env_file:
      - ./envs/verifier.env
    # A named volume at /tmp: the image runs as uid 1001 and /tmp is the one writable
    # directory it has, and Docker initialises a new volume with the mode of the directory
    # it is mounted over (1777 here). A volume at a path the image lacks would be root-owned
    # and every compiler download would fail.
    volumes:
      - verifier-compilers:/tmp
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      # No curl or wget in the image; bash's /dev/tcp is enough for an HTTP probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8050 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Ferminux-geth is a geth fork: Blockscout's geth variant cannot fetch PoW
  # miner rewards over RPC (needs trace_block). This sidecar writes the exact
  # consensus reward (6 FMX >> era, era = block/4,500,000; chain/consensus/
  # ethash/ferminux.go) plus tip fees into Blockscout's block_rewards table so
  # /api/v2/blocks and the UI show "Miner Reward". It only writes to the
  # explorer's own Postgres — never to the chain.
  rewards-sidecar:
    image: postgres:17.5-alpine
    container_name: fmx-explorer-rewards
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: blockscout
      PGPASSWORD: ${POSTGRES_PASSWORD:-fmx-explorer-db-pw}
      PGDATABASE: blockscout
      SEED_INTERVAL_SECONDS: "20"
      # seed-signers.sh asks a node WHO SEALED each authority block, via
      # clique_getSigner. The old default target (the miner) does not expose
      # the clique namespace, so attribution would have silently never run and
      # every block after the fork would have stayed credited to 0x0. Same
      # variable the backend indexes from, so the seeder and the explorer can
      # never end up reading different nodes.
      # Deliberately NOT ${FMX_RPC_HTTP}: that points at the miner, which does
      # not expose the clique namespace, so following it silently disables
      # signer attribution — every post-fork block would stay credited to 0x0.
      # Asking a different node is safe here: the sealer of a PAST block is a
      # property of the block, identical on any synced node.
      FMX_RPC: http://rpc1:8545
    volumes:
      - ./seeder:/seeder:ro
    entrypoint: ["/bin/sh", "/seeder/run.sh"]

  frontend:
    image: ghcr.io/blockscout/frontend:v2.3.5
    container_name: fmx-explorer-frontend
    logging: *logging
    restart: unless-stopped
    env_file:
      - ./envs/frontend.env
    environment:
      # Public origin the browser uses to reach this explorer.
      # Local smoke test: http://localhost:4000
      # Production:       https://explorer.ferminux.net (set proto=https, ws=wss, port=443)
      NEXT_PUBLIC_APP_PROTOCOL: ${FMX_EXPLORER_PROTO:-http}
      NEXT_PUBLIC_APP_HOST: ${FMX_EXPLORER_HOST:-localhost}
      NEXT_PUBLIC_APP_PORT: ${FMX_EXPLORER_PUBLIC_PORT:-4000}
      NEXT_PUBLIC_API_PROTOCOL: ${FMX_EXPLORER_PROTO:-http}
      NEXT_PUBLIC_API_HOST: ${FMX_EXPLORER_HOST:-localhost}
      NEXT_PUBLIC_API_PORT: ${FMX_EXPLORER_PUBLIC_PORT:-4000}
      # MUST be wss when FMX_EXPLORER_PROTO=https. A browser hard-blocks a
      # ws:// socket opened from an https:// page (mixed content), the
      # frontend throws SecurityError, and every page renders Blockscout's
      # "Oops! Something went wrong". Default stays ws for plain-http local
      # smoke tests only.
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ${FMX_EXPLORER_WS_PROTO:-ws}
      NEXT_PUBLIC_NETWORK_RPC_URL: ${FMX_PUBLIC_RPC_URL:-https://rpc.ferminux.net}
      # Favicon master. NOT NEXT_PUBLIC_ — it is read by favicon_generator.sh at
      # container start and must not reach the client, which is why it lives here
      # rather than in envs/frontend.env alongside the other branding.
      #
      # It MUST be a raster: the `favicons` package the generator uses does not
      # rasterise SVG, so pointing this at fmx.svg leaves the stock Blockscout
      # favicon in place with only a log line to say so. fmx-256.png is the
      # master. Unset, the generator falls back to NEXT_PUBLIC_NETWORK_ICON —
      # which is an SVG here, so the fallback would silently fail.
      FAVICON_MASTER_URL: ${FMX_FAVICON_MASTER_URL:-https://ferminux.net/assets/brand/fmx-256.png}

  proxy:
    image: nginx:1.29-alpine
    container_name: fmx-explorer-proxy
    logging: *logging
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${FMX_EXPLORER_PORT:-4000}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  backend-dets:
  backend-logs:
  verifier-compilers:
