[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned compiler — matches the `pragma solidity ^0.8.24` in all contracts.
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# The Yul/IR pipeline. Required, not cosmetic: the post-red-team FerminuxBridge
# (two-sided measured-effect settlement, the per-transfer short-delivery escape,
# the registry bijection, the remote-bridge registry, timelocked ownership and
# the wrapper-minter rotation) is well over the 24,576-byte EIP-170 limit on the
# legacy pipeline. via_ir compiles the identical source to 23,965 B with the SAME
# optimizer_runs, so nothing had to be cut for size. It also lowers runtime gas,
# unlike the alternative of dropping optimizer_runs.
#
# HEADROOM IS TIGHT: 611 B. Anything added here should be measured with
# `forge build --sizes` in the same commit, and the cheap levers if it ever goes
# over, in order, are:
#   (a) fold a duplicated external read into an internal helper — that is where
#       _balanceOf / _totalSupply / _requireCode came from, worth ~500 B;
#   (b) fold a duplicated `require` OUT of a modifier body and into an internal
#       function the modifier calls. A require written inline in a modifier is
#       copied into every function wearing it — twelve times for onlySelf — and
#       _onlyOwner / _onlySelf / _enter / _exit reclaimed ~170 B between them;
#   (c) fold a repeated storage read + guard into one accessor — _registeredConfig
#       (five call sites), _pendingActionAt, _writeLimits, _requireSaneLimits,
#       worth ~190 B;
#   (d) prefer one storage word to a mapping when only one entry can be live at a
#       time — shortDeliveryArmed is a bytes32, not a mapping, which is both
#       ~100 B cheaper and a tighter safety property;
# and only then (e) lower optimizer_runs, which costs runtime gas (200 -> 100
# measured at roughly -335 B).
via_ir = true

# Ferminux-geth is a fork of geth v1.10.26 (pre-Shanghai): PUSH0 is NOT a valid
# opcode on chain 3961, so bytecode must target Paris. The same contract is
# deployed on remote chains, where Paris bytecode is also valid — one artifact,
# every chain.
evm_version = "paris"

# Test-suite tuning
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }

[fmt]
line_length = 120
