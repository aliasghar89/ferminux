# Ferminux Wallet: response-header values for both origins that serve dist/
# (wallet.ferminux.net and ferminux.net/wallet/). This file is the source of
# truth for them; tests/csp.test.mjs checks it against the hosts the code
# actually talks to.
#
# The edge nginx includes it ONCE, inside its http {} block:
#
#     http {
#         include /etc/nginx/wallet/csp.conf;
#         ...
#     }
#
# and includes deploy/security-headers.inc in every server and location that
# serves the wallet (see wallet-web/README.md, "Deploy"). Nothing here sends a
# header on its own: a map only defines a variable.
#
# A new endpoint in src/ needs its host in connect-src below as well as in
# scripts/check-dist.mjs; tests/csp.test.mjs fails until it is here.

# "connect page" = a URI ending in connect.html, at either origin
# (/connect.html, /wallet/connect.html). It answers the dApp that opened it
# through window.opener and is framed by the wallet site's own status frame,
# so it gets no COOP, no X-Frame-Options, and a frame-ancestors of the wallet
# site instead of 'none'.
map $uri $fxw_connect_page {
    "~(^|/)connect\.html$" 1;
    default 0;
}

map $fxw_connect_page $fxw_frame_ancestors {
    1       "https://ferminux.net https://*.ferminux.net";
    default "'none'";
}

# No inline script or style anywhere (React sets styles through the CSSOM,
# which CSP does not govern): no 'unsafe-inline', hashes or nonces. img-src
# https: is for NFT images and WalletConnect dApp icons. The two
# verify.walletconnect hosts are the Verify API's frame and endpoint;
# pulse.walletconnect.org (telemetry) is deliberately absent.
map $fxw_connect_page $fxw_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://rpc.ferminux.net https://ferminux.net https://explorer.ferminux.net https://ethereum-rpc.publicnode.com https://eth.drpc.org https://bsc-rpc.publicnode.com https://bsc-dataseed.bnbchain.org https://base-rpc.publicnode.com https://mainnet.base.org https://arbitrum-one-rpc.publicnode.com https://arb1.arbitrum.io https://polygon-bor-rpc.publicnode.com https://polygon.drpc.org https://optimism-rpc.publicnode.com https://mainnet.optimism.io https://avalanche-c-chain-rpc.publicnode.com https://api.avax.network wss://relay.walletconnect.org https://verify.walletconnect.org https://verify.walletconnect.com; frame-src https://verify.walletconnect.org https://verify.walletconnect.com; frame-ancestors $fxw_frame_ancestors; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests";
}

# The camera is for the web QR scanner on the wallet page; the connect page
# never scans.
map $fxw_connect_page $fxw_permissions {
    1       "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    default "camera=(self), microphone=(), geolocation=(), payment=(), usb=()";
}

# An empty value makes add_header send nothing: connect.html must keep its
# window.opener, and is framed by the wallet site.
map $fxw_connect_page $fxw_coop {
    1       "";
    default "same-origin-allow-popups";
}

map $fxw_connect_page $fxw_xfo {
    1       "";
    default "DENY";
}
