name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the contracts were developed against.
  FORGE_STD_VERSION: v1.16.2

jobs:
  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # agents/contracts resolves forge-std through ../../contracts/lib
      # (see agents/contracts/remappings.txt). That directory is not vendored,
      # so CI fetches the pinned release.
      - name: Fetch forge-std
        run: |
          git clone --depth 1 --branch "$FORGE_STD_VERSION" \
            https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std
          rm -rf contracts/lib/forge-std/.git

      # the ferminux node client (v1.10.26 lineage, pre-Shanghai): PUSH0 is not a
      # valid opcode on chain 3961, so the bytecode must target Paris. This is
      # already set in agents/contracts/foundry.toml; passing it here keeps the
      # guarantee explicit and fails loudly if the config ever drifts.
      - name: forge build
        working-directory: agents/contracts
        run: forge build --evm-version paris

      - name: forge test
        working-directory: agents/contracts
        run: forge test --evm-version paris -vv

  node:
    name: ${{ matrix.package }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20']
        package: [sdk, gateway, runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agents/package-lock.json

      # agents/ is a single npm workspace root (gateway, sdk, runtime, web)
      # with one lockfile. Install once at the root, never per package.
      - name: Install workspace
        working-directory: agents
        run: npm ci

      # runtime depends on @ferminux/agent (file:../sdk), so the SDK is built
      # before anything that imports it.
      - name: Build the SDK
        working-directory: agents
        run: npm run build -w sdk

      - name: Build
        working-directory: agents
        run: npm run build -w ${{ matrix.package }}

      # npm test is `node --test test/` and runs against dist/, so build first.
      - name: Test
        working-directory: agents
        run: npm test -w ${{ matrix.package }}

  web:
    name: web (build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/package-lock.json

      - name: Install workspace
        working-directory: agents
        run: npm ci

      - name: Build
        working-directory: agents
        run: npm run build -w web

      - name: Typecheck
        working-directory: agents/web
        run: npx tsc --noEmit
