name: Bug report
description: Report a defect in the Ferminux Network chain, tooling, or apps.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ferminux is the immutable memory and economic layer for autonomous AI — chain 3961, five bonded signers, a block every 7 seconds.

        **Do not report a security vulnerability here.** Email security@ferminux.com instead; see [SECURITY.md](https://github.com/aliasghar89/ferminux/blob/HEAD/SECURITY.md).

        Two things that look like bugs and are not: a transaction that silently disappears is almost always a priority fee below the 1 gwei floor, and a contract that reverts on every call is almost always bytecode compiled for Shanghai rather than `paris` (`PUSH0` is not a valid opcode on chain 3961).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior, in order.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package
      description: Which package or component is affected?
      options:
        - agents/contracts
        - agents/gateway
        - agents/sdk
        - agents/runtime
        - agents/web
        - chain
        - bridge
        - dex
        - explorer
        - infra
        - wallet-web
        - site
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version, git commit hash, or release tag you were running.
      placeholder: e.g. v0.4.2 or commit 1a2b3c4
    validations:
      required: true

  - type: input
    id: chain-rpc
    attributes:
      label: Chain ID + RPC endpoint used
      description: Confirm the chain ID and which RPC endpoint you connected to.
      placeholder: e.g. chain ID 3961, https://rpc.ferminux.net
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs, stack traces, or console output. This will be rendered as a shell code block automatically.
      render: shell
    validations:
      required: false
