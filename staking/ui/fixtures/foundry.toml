# E2E FIXTURES for the staking UI — NOT the production contracts.
# The real StakingVault / ValidatorRegistry live in /staking/contracts (owned
# by the contracts team). These fixtures implement the DESIGN.md economics
# faithfully enough for the UI's data layer to be exercised end-to-end on a
# local anvil. Same toolchain constraints as production: solc 0.8.24, Paris,
# zero PUSH0.

[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
